<style>
body, html {
  margin: 0; padding: 0; min-height: 100vh; font-family: 'Noto Sans TC', sans-serif;
  background: linear-gradient(-45deg, #0A140E, #1C3A27, #664d14, #12261A);
  background-size: 400% 400%; animation: fluidBackground 18s ease infinite; color: #FFFFFF;
  transition: background 1.2s ease;
}
@keyframes fluidBackground { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.liquid-glass {
  background: rgba(255,255,255,0.08); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
}
.liquid-glass-dark {
  background: rgba(0,0,0,0.3); backdrop-filter: blur(20px) saturate(120%); -webkit-backdrop-filter: blur(20px) saturate(120%);
  border: 1px solid rgba(255,255,255,0.1);
}
@keyframes popIn { 0% { opacity: 0; transform: translateY(20px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
.node-reveal { animation: popIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
.btn-bounce:active { transform: scale(0.95); transition: transform .1s ease; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

.view { display: none; }
.view.active { display: block; }

.typing-dot { animation: blink 1.4s infinite both; }
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

.chip { transition: all .15s ease; }
.chip:active { transform: scale(.95); }

#tea-scroll::-webkit-scrollbar { display: none; }

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(10px); }
  100% { opacity: 1; transform: translateY(0); }
}
.fade-in-block {
  opacity: 0;
  animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
/* 這些區塊改成「捲動到畫面內才播放」，不管用什麼方式抵達，動畫節奏都一致 */
.scroll-fade { opacity: 0; }
.scroll-fade.in-view {
  animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* ===== iOS / WebKit 重繪相容性 =====
   iPhone 上 LINE、Safari、Chrome 底層都是 WebKit。
   只停用「整個 view 的 node-reveal 進場動畫」——那是造成返回白屏
   （舊 compositing layer 殘留）的主因；
   卡片與文字各自的淡入＋上移動畫、玻璃效果、底色漸變全部保留。 */
@supports (-webkit-touch-callout: none) {
  .view.node-reveal {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  /* blur 在 WebKit 上 compositing 負擔重，進場動畫一律不帶 blur */
  .fade-in-block,
  .scroll-fade,
  .scroll-fade.in-view {
    filter: none !important;
  }
}
</style>

// 把一段文字拆成一句一句，回傳帶淡入動畫、各自延遲出場的 span 組合
function splitSentences(text) {
  return text.match(/[^。！？]+[。！？]?/g) || [text];
}
function fadeText(text, baseDelayMs, stepMs = 110) {
  return splitSentences(text)
    .map((s, i) => `<span class="fade-in-block" style="display:inline-block; animation-delay:${baseDelayMs + i * stepMs}ms">${s}</span>`)
    .join('');
}

function renderLandingCards() {
  const box = document.getElementById('tea-scroll');
  box.innerHTML = '';
  TEA_DB.forEach(tea => {
    const card = document.createElement('button');
    card.className = "liquid-glass-dark border border-white/20 rounded-2xl p-4 lg:p-6 flex-shrink-0 w-36 md:w-auto snap-start transition-all btn-bounce text-left";
    card.onmouseenter = () => { card.style.borderColor = tea.color; };
    card.onmouseleave = () => { card.style.borderColor = ''; };
    card.onclick = () => openProduct(tea.id);
    card.innerHTML = `
      <div class="w-full aspect-square rounded-xl flex items-center justify-center text-4xl lg:text-6xl" style="background:${tea.color}22; border:1px solid ${tea.color}55">${tea.emoji}</div>

      <div class="text-[10px] lg:text-sm text-white/50 text-center mt-1">${tea.tag}</div>
      <div class="w-full mt-3 text-[11px] lg:text-sm font-bold text-center" style="color:${tea.color}">查看介紹 →</div>`;
    box.appendChild(card);
  });
}

/* 快速提問按鈕：題庫比顯示數量多，每次問完就從題庫裡重新抽一批不重複的，
   不會一直卡在同三個問題 */
const PRODUCT_QUESTION_POOL = [
  '這款茶為什麼會有這樣的配方組合？',
  '佛手茶是什麼？',
  '這些材料在傳統飲食文化中有什麼特色？',
  '這款茶適合什麼時候喝？',
  '這款茶會苦嗎？',
  '要怎麼沖泡才好喝？',
  '可以冷泡嗎？',
  '跟一般烏龍茶有什麼不同？'
];
// suggestions：AI 產生的建議問題；沒有（或解析失敗）時，退回從題庫隨機抽
function renderProductChips(suggestions) {
  const box = document.getElementById('product-chips');
  if (!box) return;
  const picks = (suggestions && suggestions.length)
    ? suggestions.slice(0, 3)
    : [...PRODUCT_QUESTION_POOL].sort(() => Math.random() - 0.5).slice(0, 3);
  box.innerHTML = '';
  picks.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'chip text-[10px] liquid-glass-dark border border-white/20 rounded-full px-3 py-1.5';
    btn.innerText = q;
    btn.onclick = () => askProduct(q);
    box.appendChild(btn);
  });
}

function forceIOSRepaint(el) {
  // 輕量 layout flush，讓 iOS WebKit 在 view 切換後重新提交畫面。
  if (!el) return;
  void el.getBoundingClientRect();
}

function showView(name) {
  const views = document.querySelectorAll('.view');
  const target = document.getElementById('view-' + name);
  if (!target) return;

  // 清掉上一個 view 的動畫狀態，避免 WebKit 保留舊 compositing layer。
  views.forEach(v => {
    v.classList.remove('active');
    v.classList.remove('node-reveal');
  });

  // 先完成一次 layout，再顯示目標 view。
  void document.body.offsetHeight;
  target.classList.add('active');
  void target.offsetHeight;

  // 分兩個 frame 執行，讓 iOS 先完成 display/layout 再重繪。
  requestAnimationFrame(() => {
    target.classList.add('node-reveal');
    forceIOSRepaint(target);

    requestAnimationFrame(() => forceIOSRepaint(target));
  });

  document.getElementById('back-btn').classList.toggle('hidden', name === 'landing');

  const sub = name === 'landing'
    ? '一握・系列'
    : (name === 'product'
        ? TEA_DB.find(t => t.id === currentTeaId)?.name || '產品介紹'
        : 'AI 茶伴');

  document.getElementById('header-sub').innerText = sub;

  // 不使用 smooth，避免 iOS 同時處理捲動動畫與 view 重繪。
  window.scrollTo(0, 0);

  // 回到首頁時把網址上的 ?tea= 拿掉，避免重新整理又跳回茶款頁
  if (name === 'landing' && location.search) {
    history.replaceState(null, '', location.pathname);
  }

  // 每款茶進到產品頁時，整個頁面背景會換成那款茶的專屬色調；離開產品頁則還原
  if (name === 'product') {
    const tea = TEA_DB.find(t => t.id === currentTeaId);
    document.body.style.backgroundImage = tea ? tea.bg : DEFAULT_BG;
  } else {
    document.body.style.backgroundImage = DEFAULT_BG;
  }

  if (name === 'companion' && document.getElementById('companion-log').children.length === 0) {
    startCompanion();
  }
}

function addBubble(logId, role, text) {
  const log = document.getElementById(logId);
  const wrap = document.createElement('div');
  wrap.className = role === 'user' ? 'flex justify-end' : 'flex justify-start';
  const bubble = document.createElement('div');
  bubble.className = role === 'user'
    ? 'bg-tea-gold text-tea-dark rounded-2xl rounded-tr-sm px-4 py-2.5 max-w-[80%] font-medium'
    : 'liquid-glass-dark border border-white/10 rounded-2xl rounded-tl-sm px-4 py-2.5 max-w-[85%] text-white/85 leading-relaxed';
  bubble.innerText = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

// 讓 AI 的回覆一個字一個字跑出來，回傳一個 Promise，動畫跑完才 resolve
function typeIntoBubble(logId, bubble, text, speed = 22) {
  return new Promise(resolve => {
    const log = document.getElementById(logId);
    let i = 0;
    const timer = setInterval(() => {
      i++;
      bubble.innerText = text.slice(0, i);
      log.scrollTop = log.scrollHeight;
      if (i >= text.length) {
        clearInterval(timer);
        resolve();
      }
    }, speed);
  });
}

function addTyping(logId) {
  const log = document.getElementById(logId);
  const wrap = document.createElement('div');
  wrap.className = 'flex justify-start';
  wrap.id = logId + '-typing';
  wrap.innerHTML = `<div class="liquid-glass-dark border border-white/10 rounded-2xl rounded-tl-sm px-4 py-3 flex gap-1">
    <span class="typing-dot">●</span><span class="typing-dot">●</span><span class="typing-dot">●</span>
  </div>`;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}
function removeTyping(logId) {
  const el = document.getElementById(logId + '-typing');
  if (el) el.remove();
}

// 把我們自己存的對話紀錄格式，轉成 Gemini API 要的格式（bot 要轉成 model）
function toGeminiContents(history) {
  return history.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }));
}

async function callGemini(systemPrompt, contents) {
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: GEMINI_MODEL,
      contents,
      systemInstruction: { parts: [{ text: systemPrompt }] },
      generationConfig: { temperature: 0.8, maxOutputTokens: 400 }
    })
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`API 錯誤 (${res.status}): ${errText}`);
  }
  const data = await res.json();
  return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "（沒有收到回覆，請再試一次）";
}

/* ---------------- 產品介紹頁問答 ---------------- */
async function askProduct(presetText) {
  const tea = TEA_DB.find(t => t.id === currentTeaId);
  const input = document.getElementById('product-chat-input');
  const text = presetText || input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('product-chips').innerHTML = '';
  addBubble('product-chat-log', 'user', text);
  productLogs[currentTeaId].push({ role: 'user', text });
  addTyping('product-chat-log');

  const systemPrompt = `你是「一握茶研所」品牌的茶伴 AI，現在使用者正在看的是「${tea.name}」這款茶的介紹頁。
這款茶資訊：系列「${tea.series}」，配方「${tea.formula}」，風味「${tea.flavor}」，適合情境「${tea.fit}」。
請以溫暖、口語、像懂茶的朋友的語氣回答使用者關於這款茶、佛手茶本身、茶葉配方材料、或傳統飲食茶文化的問題。
使用者前面說過的話你都記得，遇到「這款茶」「剛剛那個」之類的指涉，直接依對話紀錄判斷指的是什麼，不要反問。
【重要規範】絕對不能使用「燃脂」「排油」「減肥」「瘦身」「代謝」「消脂」等暗示醫療或減重功效的字眼，即使使用者主動問「這款茶能減肥嗎」也一樣。遇到這類問題，只回答茶本身的風味、傳統飲食文化中的角色與感受（例如「讓人餐後感覺清爽舒服」），並清楚說明這是茶飲不是保健品或藥品，不具有醫療或減重功效，不要用任何轉折語氣暗示它「還是有幫助」。
回答控制在 100 字以內，不要條列，不要使用「首先/其次」這類生硬詞，不要提及你是語言模型。若問題與茶完全無關，禮貌引導回到茶的話題。
【輸出格式】回答結束後，另起一行，固定用這個格式列出 3 個使用者可能想接著問的問題：
【建議】問題一|問題二|問題三
規則：問題一必須直接延續使用者剛剛問的內容或你剛剛的回答（追問細節）；問題二、三可以帶到這款茶的其他面向（沖泡方式、風味、適合時機、佛手茶文化等）。每個問題 15 字以內，用使用者的口吻，不要跟對話中已經問過的重複，也不要出現上面禁止的功效字眼。`;

  try {
    const contents = toGeminiContents(productLogs[currentTeaId]);
    const raw = await callGemini(systemPrompt, contents);
    // 把 AI 附在最後的【建議】那行拆出來，當作按鈕；泡泡裡只顯示正文
    const [replyPart, suggestPart] = raw.split('【建議】');
    const reply = replyPart.trim();
    const suggestions = suggestPart
      ? suggestPart.split('|').map(s => s.trim()).filter(Boolean)
      : [];
    removeTyping('product-chat-log');
    const bubble = addBubble('product-chat-log', 'bot', '');
    await typeIntoBubble('product-chat-log', bubble, reply);
    productLogs[currentTeaId].push({ role: 'bot', text: reply });
    renderProductChips(suggestions);
  } catch (e) {
    removeTyping('product-chat-log');
    const errMsg = '目前連線有點問題，稍後再試試看 🙏（' + e.message + '）';
    addBubble('product-chat-log', 'bot', errMsg);
    renderProductChips();
  }
}

/* ---------------- AI 茶伴推薦流程 ---------------- */
let companionStage = 0;
let companionHistory = [];

function startCompanion() {
  addBubble('companion-log', 'bot', '嗨，今天想喝一杯什麼樣的茶呢？可以跟我說說你今天的狀態或心情 🍃');

async function sendCompanion() {
  const input = document.getElementById('companion-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('companion-chips').innerHTML = '';
  addBubble('companion-log', 'user', text);
  companionHistory.push({ role: 'user', text });
  addTyping('companion-log');

  const dbText = TEA_DB.map(t => `- ${t.name}（${t.series}）：配方 ${t.formula}；風味 ${t.flavor}；適合 ${t.fit}`).join('\n');
  const systemPrompt = `你是「一握茶研所」的 AI 茶伴，任務是根據使用者描述的今天狀態或心情，從下面的茶款清單中挑一款最適合的推薦給他。
茶款清單：
${dbText}

請以專業、簡潔、像品茶師介紹茶葉的語氣回覆，格式參考：「今天的你可以試試『茶名』，用一句話說明為什麼適合、能帶來什麼感受。」
只推薦清單裡的一款，不要編造清單以外的茶。控制在 80 字以內，不要條列。
使用者前面說過的話你都記得，如果使用者接著問「這款茶的介紹」「為什麼推薦這款」之類的問題，直接針對你剛剛推薦的那一款回答，不要反問使用者是指哪一款。
【重要規範】絕對不能使用「燃脂」「排油」「減肥」「瘦身」「代謝」「消脂」等暗示醫療或減重功效的字眼，即使使用者主動問也一樣。只能描述風味與情境上的舒適感（例如餐後清爽），並清楚說明茶飲不具醫療或減重功效，不要用任何轉折語氣暗示它「還是有幫助」。
【輸出格式】回答結束後，另起一行，固定用這個格式列出 3 個使用者可能想接著說的話：
【建議】建議一|建議二|建議三
規則：建議一必須直接延續剛剛的對話（例如追問你推薦的這款茶）；建議二、三可以是換一種心情或狀態、或想了解其他茶款。每個 15 字以內，用使用者的口吻，不要跟對話中已經說過的重複，也不要出現上面禁止的功效字眼。`;

  try {
    const contents = toGeminiContents(companionHistory);
    const raw = await callGemini(systemPrompt, contents);
    // 把 AI 附在最後的【建議】那行拆出來當按鈕；泡泡裡只顯示正文
    const [replyPart, suggestPart] = raw.split('【建議】');
    const reply = replyPart.trim();
    const suggestions = suggestPart
      ? suggestPart.split('|').map(s => s.trim()).filter(Boolean).slice(0, 3)
      : [];
    removeTyping('companion-log');
    const bubble = addBubble('companion-log', 'bot', '');
    await typeIntoBubble('companion-log', bubble, reply);
    companionHistory.push({ role: 'bot', text: reply });

    // 從 AI 的回覆文字裡比對出提到的是哪一款茶，出現的話在下面加一個可以直接點過去的按鈕
    const mentionedTea = TEA_DB.find(t => reply.includes(t.name));
    if (mentionedTea) {
      const linkWrap = document.createElement('div');
      linkWrap.className = 'flex justify-start mt-1';
      const linkBtn = document.createElement('button');
      linkBtn.className = 'chip text-[11px] bg-tea-gold/90 text-tea-dark font-bold rounded-full px-3.5 py-1.5 flex items-center gap-1.5';
      linkBtn.innerHTML = `<span>${mentionedTea.emoji}</span>看看「${mentionedTea.name}」的完整介紹 →`;
      linkBtn.onclick = () => openProduct(mentionedTea.id);
      linkWrap.appendChild(linkBtn);
      document.getElementById('companion-log').appendChild(linkWrap);
      document.getElementById('companion-log').scrollTop = document.getElementById('companion-log').scrollHeight;
    }

    companionStage = 1;
    // AI 有給建議就用 AI 的；沒有的話退回預設按鈕
    renderChips(suggestions.length ? suggestions : ['再推薦一次', '想看這款茶的介紹', '換一種心情']);
  } catch (e) {
    removeTyping('companion-log');
    addBubble('companion-log', 'bot', '目前連線有點問題，稍後再試試看 🙏（' + e.message + '）');
    renderChips(['想放鬆一下', '最近外食比較多', '想喝點溫暖的']);
  }
}

// 讓 .scroll-fade 區塊在「真正進入畫面」的當下才播放淡入動畫，
// 不論是手動滑過去、還是按按鈕跳過去，節奏都一致
const scrollFadeObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in-view');
      scrollFadeObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.2 });
document.querySelectorAll('.scroll-fade').forEach(el => scrollFadeObserver.observe(el));
